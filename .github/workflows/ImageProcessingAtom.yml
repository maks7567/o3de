name: ImageProcessingAtom

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B "${{ github.workspace }}/build" -S "${{ github.workspace }}"

      - name: Build Target
        run: |
          cmake --build "${{ github.workspace }}/build" --target ImageProcessingAtom.Editor --config Release
