name: C++ Build and Test

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

# Cancel older in-flight runs on the same branch or PR when new pushes occur
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Shallow clone to download only the latest commit
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Setup MSBuild path environment
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. Enable sccache for C/C++ compiler caching across workflow runs
      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.8

      - name: Configure environment variables
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV

      # 4. Build solution using multi-processor execution flags (/m)
      - name: Build Project
        run: |
          msbuild Code/Tools/AssetProcessor/AssetBuilder/AssetBuilder.vcxproj /p:Configuration=Release /m