name: Build Targeted Asset Processor

on:
  workflow_dispatch:

jobs:
  build-asset-processor:
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build/windows -S . -G "Visual Studio 17 2022" -A x64

      - name: Build Asset Processor Target
        run: |
          cmake --build build/windows --target AssetProcessor --config profile -- -m

      - name: Upload Asset Processor Artifact
        uses: actions/upload-artifact@v4
        with:
          name: O3DE-AssetProcessor-Windows
          path: build/windows/bin/profile/
